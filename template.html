<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Offline synthetic bond issuer review and amendment comparison"><title>Issuer desk | Bond reference review</title><link rel="stylesheet" href="desk.css"></head>
<body><header class="mast"><div class="wrap mast-row"><b class="brand"><i aria-hidden="true"></i>Issuer desk</b><span class="demo-tag">Local demo</span></div></header>
<main class="wrap"><div class="intro" id="review"><h1>Bond issuer review</h1><p>Check the legal name against the offering terms before confirming the link.</p></div>
<nav aria-label="Workspace sections"><a href="#review">Review a note</a><a href="#compare" aria-label="Compare a filing with an amendment">Compare amendments</a></nav>
<div class="toolbar"><label>Note<select id="case"></select></label><label>Review method<select id="route"><option>Exact label</option><option>Local model + rules</option></select></label><span class="sample">Synthetic records</span></div>
<div class="workspace"><section class="paper"><div class="sheet-head"><span>Source document</span><span id="source"></span></div><h2>Offering excerpt</h2><ol class="transcript" id="lines"></ol></section>
<section class="decision"><div class="sheet-head"><span>Issuer decision</span><span class="status" id="decisionState"></span></div><h2 id="candidate" aria-live="polite"></h2><p id="reason"></p><div class="actions"><button id="confirm">Confirm issuer link</button><button class="secondary" id="undo">Reopen</button></div><details><summary>Decision history</summary><ol id="audit"></ol></details></section></div>
</main><script>
const {cases,entities,original,revisions}=/*DATA*/;
const el=id=>document.getElementById(id),key="issuer-desk-synthetic-v1";
const events=JSON.parse(localStorage.getItem(key)||"[]");
cases.forEach(c=>el("case").add(new Option("Note "+c.case,c.case)));
function state(){const c=cases[el("case").selectedIndex],route=el("route").selectedIndex;return {c,route,r:c.routes[route],history:events.filter(e=>e.case===c.case)}}
function paint(){const {c,r,history}=state(),last=history.at(-1),active=last?.action==="Confirmed";
el("source").textContent="Note "+c.case+" / Version 1";
el("decisionState").textContent=active?"Confirmed":r[0]?"Awaiting review":"Needs evidence";
const evidence=active?last.lines:r[1];
el("lines").replaceChildren(...c.lines.map((s,i)=>{const li=document.createElement("li"),v=document.createElement(evidence.includes(i+1)?"mark":"span");v.textContent=s;li.append(v);return li}));
el("candidate").textContent=active?"Confirmed · "+last.name:r[0]||"Hold for research";
el("reason").textContent=active?"Directory "+last.id+" · source lines "+last.lines.join(", "):r[0]?"Directory "+entities[r[0]]+" · check highlighted line "+r[1].join(", "):r[2];
el("confirm").disabled=active||!r[0];el("undo").disabled=!active;
el("audit").replaceChildren(...history.map(e=>{const li=document.createElement("li");li.textContent=[e.at,e.action,e.name,e.id,"lines "+e.lines.join(", "),e.method].join(" · ");return li}))}
function save(action){const {c,r,history}=state();const previous=history.at(-1);const e=action==="Reopened"?{...previous}:{case:c.case,name:r[0],id:entities[r[0]],lines:r[1],method:el("route").selectedOptions[0].text};events.push({...e,action,at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(events));paint()}
el("case").onchange=el("route").onchange=paint;el("confirm").onclick=()=>save("Confirmed");el("undo").onclick=()=>save("Reopened");paint();</script><script src="amendment-view.js"></script></html>
